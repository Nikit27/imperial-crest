// Open:   P&L = −entryTC
// Closed: P&L = Gross − entryTC − exitTC  (full net, both legs)
function calcEntryPnl(entry,exit,lots,side,spec,status){
  if(!spec||!spec.tickValue||!spec.tickSize)return "";
  const l=parseFloat(lots);
  if(isNaN(l)||l<=0)return "";
  const entryTc=l*parseFloat(spec.tc||0);
  const e=parseFloat(entry),x=parseFloat(exit);
  if(isNaN(e)||isNaN(x)){
    if(isNaN(e))return "";
    return (-entryTc).toFixed(2); // open, no exit yet
  }
  const priceDiff = side==="Buy" ? (x-e) : (e-x);
  const ticks = Math.round((priceDiff / spec.tickSize) * 1e10) / 1e10;
  const gross = ticks * l * parseFloat(spec.tickValue);
  const tcLegs = (status==="Open") ? 1 : 2;
  return (gross - entryTc * tcLegs).toFixed(2);
}
// Exit-leg TC cost (negative, deducted on close date)
function calcExitTc(lots,spec){
  if(!spec||!spec.tc)return 0;
  const l=parseFloat(lots);
  if(isNaN(l)||l<=0)return 0;
  return l*parseFloat(spec.tc||0);
}
// Legacy wrapper
function calcPnl(entry,exit,lots,side,spec,status){
  return calcEntryPnl(entry,exit,lots,side,spec,status);
}

  const perLot=CONTRACTS_PER_LOT[tradeType]||1;
  const legs=(status==="Open")?1:2; // open = entry only, closed = entry + exit
  return l*perLot*legs;
}

function pushToFirebase(trades){
  try{
    const db=getDb(),obj={};
    trades.forEach(t=>{if(t.id)obj[t.id]=t;});
    db.ref("/trades").set(obj);
    const closed=trades.filter(t=>t.status==="Closed"||t.exitPrice).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
    db.ref("/pnl/closed_pnl").set(Math.round(closed*100)/100);
    db.ref("/pnl/updated_at").set(new Date().toISOString());
  }catch(e){console.warn("Firebase push failed:",e.message);}
}

// ── FCPO TC (per contract) ────────────────────────────────────────────────────
const FCPO_TC_PER_CONTRACT=1.27;
const CONTRACTS_PER_TYPE={"Outright":1,"Spread":2,"Butterfly":4,"Double Fly":8};

// ── Open position TC hint ─────────────────────────────────────────────────────
function OpenTcHint({form,spec}){
  const mono={fontSize:11,color:G400,marginTop:5,fontFamily:"'JetBrains Mono',monospace"};
  const hasExit=form.exitPrice&&form.exitPrice.toString().trim()!=="";
  if(hasExit){
    const txt=form.product==="FCPO"
      ?`Gross − (${form.lots||1}×${CONTRACTS_PER_TYPE[form.tradeType||"Outright"]} contracts × $${FCPO_TC_PER_CONTRACT} × 2 legs)`
      :`(±ticks / ${spec.tickSize}) × Lots × $${spec.tickValue} − Lots × 2 × $${spec.tc} TC`;
    return <div style={mono}><span>{txt}</span></div>;
  }
  const lots=parseFloat(form.lots)||1;
  const contracts=CONTRACTS_PER_TYPE[form.tradeType||"Outright"]||1;
  const entryTc=form.product==="FCPO"?lots*contracts*FCPO_TC_PER_CONTRACT:lots*parseFloat(spec.tc||0);
  const roundTrip=entryTc*2;
  const breakdown=form.product==="FCPO"?`${lots} × ${contracts} contracts × $${FCPO_TC_PER_CONTRACT}`:`${lots} lots × $${spec.tc}`;
  return(
    <div style={mono}>
      <div>Entry TC paid: <strong style={{color:RED}}>{"−$"+entryTc.toFixed(2)}</strong> <span>({breakdown})</span></div>
      <div>Exit TC on close: <strong style={{color:RED}}>{"−$"+entryTc.toFixed(2)}</strong> <span>(same)</span></div>
      <div style={{borderTop:"1px solid #e5e7eb",marginTop:4,paddingTop:4}}>Round-trip TC: <strong style={{color:RED}}>{"−$"+roundTrip.toFixed(2)}</strong></div>
    </div>
  );
}

  function getSpec(productName){
    return productSpecs.find(p=>p.name===productName)||null;
  }

    setToast({msg,err});

        if(dateMode==="range"){
          if(dateFrom&&dateTo)return t.date>=dateFrom&&t.date<=dateTo;
          if(dateFrom)return t.date>=dateFrom;
          if(dateTo)return t.date<=dateTo;
        }
        return true;
      })
      .sort((a,b)=>{
          const cmp=a.date<b.date?-1:a.date>b.date?1:0;
          return sortDir==="desc"?-cmp:cmp;

  const products=["All",...Array.from(new Set(trades.map(t=>t.product)))];
  const allProductNames=productSpecs.map(p=>p.name);

  function setF(key,val){
    setForm(p=>{
      const n={...p,[key]:val};
      if(key==="exitPrice"){n.status=val.trim()!==""?"Closed":"Open";}
      // Auto-detect trade type from FCPO contract
      if(key==="contract"&&n.product==="FCPO"){
        if(val.includes("1mo Butterfly"))n.tradeType="Butterfly";
        else if(val.includes("2mo Butterfly"))n.tradeType="Double Fly";
        else if(val.includes("Calendar")){
          const ALL=["May26","FCPO Jun26","FCPO Jul26","Aug26","Sep26","Oct26","Nov26","Dec26","Jan27","Feb27","Mar27","Apr27","May27","Jul27","Sep27","Nov27","Jan28"];
          const m=val.match(/FCPO (\w+)-(\w+) Calendar/);
          n.tradeType=m&&(ALL.indexOf(m[2])-ALL.indexOf(m[1]))===1?"Spread":"Spread";
        } else n.tradeType="Outright";
      }
      // Recalculate PnL
      const spec=getSpec(n.product);
      if(spec&&spec.tickValue>0&&["entryPrice","exitPrice","lots","side","product","status","tradeType","contract"].includes(key)){
        const l=parseFloat(n.lots); if(isNaN(l)||l<=0)return n;
        const hasExit=n.exitPrice&&n.exitPrice.toString().trim()!=="";
        const legs=hasExit?2:1;
        const tc=n.product==="FCPO"?l*(CONTRACTS_PER_TYPE[n.tradeType||"Outright"]||1)*FCPO_TC_PER_CONTRACT*legs:l*parseFloat(spec.tc||0)*legs;
        const e=parseFloat(n.entryPrice);
        if(!isNaN(e)){
          if(!hasExit){n.pnl=(-(n.product==="FCPO"?l*(CONTRACTS_PER_TYPE[n.tradeType||"Outright"]||1)*FCPO_TC_PER_CONTRACT:l*parseFloat(spec.tc||0))).toFixed(2);}
          else{
            const x=parseFloat(n.exitPrice);
            if(!isNaN(x)){const diff=n.side==="Buy"?(x-e):(e-x);const ticks=Math.round((diff/spec.tickSize)*1e10)/1e10;n.pnl=(ticks*l*spec.tickValue-tc).toFixed(2);}
          }
        }
      }
      return n;
    });
  }

      {/* Delete Confirmation Modal */}
      {confirmDelete&&(
        <div style={{position:"fixed",inset:0,background:"rgba(5,10,25,0.65)",zIndex:9000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div className="fade" style={{background:"#fff",borderRadius:14,padding:"32px 36px",maxWidth:380,width:"100%",boxShadow:"0 24px 80px rgba(0,0,0,0.25)",textAlign:"center"}}>

            <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:NAVY,marginBottom:8}}>

            </div>

            {/* Date filter bar */}

              <div style={{display:"flex",background:G100,borderRadius:8,padding:3,gap:1}}>

              const rrTrades=filtered.filter(t=>{

              });

                const e=parseFloat(t.entryPrice),tg=parseFloat(t.target),st=parseFloat(t.stop);
                const reward=Math.abs(tg-e);
                const risk=Math.abs(e-st);

                  <StatCard label="Total Contracts" value={totalContracts} sub={filtered.length+" trade"+(filtered.length!==1?"s":"")}/>
                </div>

            {/* Table */}
            {(()=>{
              // ONE row per trade, always on entry date.
              // Open:   P&L = −entryTC
              // Closed: P&L = Gross − entryTC − exitTC  (full net)
              function expandRows(trades){
                const rows=[];
                trades.forEach((t,idx)=>{
                  // pnl stored = full net (gross − entryTC − exitTC for closed, −entryTC for open)
                  const pnlDisplay=t.pnl!==""?parseFloat(t.pnl).toFixed(2):"—";
                  rows.push({t,date:t.date,pnlDisplay,status:t.status||"Closed",idx});
                });
                return rows;
              }

              const rows=expandRows(filtered);
              const COLS="90px 76px 80px 1fr 70px 50px 80px 80px 90px 86px 110px 56px";
