*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
header{background:var(--navy);padding:env(safe-area-inset-top,0) 0 0;position:sticky;top:0;z-index:20;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.brand-name{font-family:'Playfair Display',serif;font-size:20px;color:#fff;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:0.1em;text-transform:uppercase;margin-top:1px;}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.1);border-radius:20px;padding:5px 10px;}
.dot{width:6px;height:6px;border-radius:50%;background:#6b7280;}
.dot.live{background:#22c55e;animation:pulse 2s infinite;}
.dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.live-text{font-size:10px;color:rgba(255,255,255,0.7);}

/* SCROLL */
.scroll-body{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+80px);}

/* PNL HERO */
.pnl-hero{background:var(--white);border-bottom:1px solid var(--border);padding:20px 16px;}
.pnl-total-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
.pnl-total{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;line-height:1;}
.pnl-total.pos{color:var(--green);}
.pnl-total.neg{color:var(--red);}
.pnl-total.zero{color:var(--sub);}
.pnl-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.pnl-box{background:var(--light);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.pnl-box-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--sub);margin-bottom:4px;}
.pnl-box-val{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;}
.pnl-box-val.pos{color:var(--green);}
.pnl-box-val.neg{color:var(--red);}
.pnl-box-val.zero{color:var(--sub);}
.pnl-box-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.updated-text{font-size:11px;color:var(--sub);margin-top:10px;}

/* SECTION */
.section{margin-bottom:2px;}
.sec-title-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
.sec-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);}
.sec-pnl{font-size:12px;font-weight:700;}
.sec-pnl.pos{color:var(--green);}.sec-pnl.neg{color:var(--red);}

/* POSITION CARDS */
.pos-cards{padding:0 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.pos-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--border);}
.pos-card.buy-card{border-left-color:#16a34a;}
.pos-card.sell-card{border-left-color:var(--red);}
.pos-name{font-size:14px;font-weight:600;color:var(--text);}
.pos-meta{font-size:12px;color:var(--sub);margin-top:3px;}
.pos-side{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.pos-side.buy{background:#dcfce7;color:#15803d;}
.pos-side.sell{background:#fee2e2;color:#b91c1c;}
.pos-pnl-val{font-size:18px;font-weight:700;font-family:'Playfair Display',serif;text-align:right;}
.pos-pnl-val.pos{color:var(--green);}
.pos-pnl-val.neg{color:var(--red);}
.pos-pnl-val.zero{color:var(--sub);}
.pos-mid{font-size:11px;color:var(--sub);text-align:right;margin-top:2px;}

/* PRICES */
.price-wrap{padding:12px 16px;}
.price-sec{margin-bottom:16px;}
.price-sec-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);margin-bottom:8px;}
.price-table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.price-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--sub);padding:8px 12px;text-align:right;background:var(--light);border-bottom:1px solid var(--border);}
.price-table th:first-child{text-align:left;}
.price-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);text-align:right;color:var(--text);}
.price-table td:first-child{text-align:left;font-weight:500;}
.price-table tr:last-child td{border-bottom:none;}
.price-table tr:hover td{background:var(--light);}

.j-stat-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--sub);margin-bottom:4px;}
.j-stat-val{font-size:18px;font-weight:700;font-family:'Playfair Display',serif;}
.j-filters{display:flex;gap:6px;margin-bottom:12px;}
.j-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}

.j-card.neg-b{border-left-color:var(--red);}
.j-card-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;}
.j-name{font-size:14px;font-weight:600;color:var(--text);}
.j-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.j-pnl{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;}
.j-pnl.pos{color:var(--green);}.j-pnl.neg{color:var(--red);}
.j-card-mid{padding:10px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--light);border-top:1px solid var(--border);}
.j-field-label{font-size:10px;color:var(--sub);font-weight:500;margin-bottom:2px;}
.j-field-val{font-size:12px;font-weight:600;color:var(--text);}
.j-card-bot{padding:8px 14px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);}
.j-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;}
.j-badge.buy{background:#dcfce7;color:#15803d;}
.j-badge.sell{background:#fee2e2;color:#b91c1c;}
.j-badge.closed{background:#f0fdf4;color:#15803d;}
.j-badge.open{background:#fef9c3;color:#854d0e;}
.j-badge.type{background:var(--light);color:var(--sub);border:1px solid var(--border);}
.j-date{font-size:11px;color:var(--sub);margin-left:auto;}
.j-actions{display:flex;gap:4px;margin-left:auto;}
.j-btn-edit{padding:3px 10px;background:var(--navy);color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;}
.j-btn-del{padding:3px 10px;background:#fff;color:var(--red);border:1px solid #fca5a5;border-radius:5px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;}

.s-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);}
.s-row:last-child{border-bottom:none;}
.s-lbl{font-size:14px;color:var(--text);font-weight:500;}
.s-val{font-size:12px;color:var(--sub);}

.tab-btn.active{background:#f0f4ff;color:var(--navy);}
.tab-icon{font-size:18px;}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-msg{color:var(--sub);font-size:14px;text-align:center;line-height:1.7;}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px)+16px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:999;white-space:nowrap;animation:tin 0.2s ease;}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.divider{height:8px;background:var(--bg);}
</style>

function initFirebase(){
  // Render immediately with SAMPLE data — don't wait for Firebase
  renderPnl();

  try{
    if(!firebase.apps.length)firebase.initializeApp(FB);
    db=firebase.database();
    db.ref("/prices").on("value",snap=>{
      const d=snap.val();if(!d)return;
      fbData=d;setStatus(new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),"live");
      if(currentTab==="pnl")renderPnl();else if(currentTab==="prices")renderPrices();
    },()=>setStatus("Error","error"));
    db.ref("/pnl").on("value",snap=>{
      const d=snap.val();if(d){pnlData=d;if(currentTab==="pnl")renderPnl();}
    });
    db.ref("/positions").on("value",snap=>{
      const d=snap.val();
      if(d&&Array.isArray(d))positions=d;
      else if(d&&typeof d==="object")positions=Object.values(d);
      else positions=[];
      if(currentTab==="pnl")renderPnl();
    });
    db.ref("/trades").on("value",snap=>{
      const d=snap.val();
      if(d&&Object.keys(d).length>0){trades=Object.values(d);}
      else{trades=SAMPLE_TRADES.slice();}
      const cp=trades.filter(t=>t.status==="Closed"||(t.exitPrice&&t.exitPrice.toString().trim()!=="")).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
      db.ref("/pnl/closed_pnl").set(Math.round(cp*100)/100);
      if(currentTab==="journal")renderJournal();
      if(currentTab==="pnl")renderPnl();
      if(currentTab==="dashboard")renderDashboard();
    });
  }catch(e){setStatus("Offline","error");}
}

function setStatus(t,s){
  document.getElementById("status-text").textContent=t;
  document.getElementById("status-dot").className="dot "+(s||"");
}
function getPrice(k){
  if(!fbData)return null;
  const s=(fbData.outrights||{})[k]||(fbData.derived||{})[k];
  return s?(s.mid??s.last??null):null;
}
function calcPosPnl(pos){
  if(!pos.entry||!pos.lots||!pos.side)return null;
  const mid=getPrice(pos.priceKey);if(mid===null)return null;
  return ((pos.side==="Buy"?(mid-pos.entry):(pos.entry-mid))/TS)*pos.lots*TV;
}
function fmt(v){const n=parseFloat(v)||0;return (n>=0?"+":"")+`$${Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function fc(v){return parseFloat(v)>0?"pos":parseFloat(v)<0?"neg":"zero";}

function setDashFilter(from,to){ dashDateFrom=from; dashDateTo=to; renderDashboard(); }

function renderDashboard(){
  function tradeDate(t){ return (t.closeDate&&t.closeDate.trim())?t.closeDate:t.date; }

  const allClosed = trades.filter(t => t.status==="Closed"||(t.exitPrice&&t.exitPrice.toString().trim()!==""));
  const filtered = allClosed.filter(t => {
    const d=tradeDate(t);
    if(dashDateFrom&&d<dashDateFrom)return false;
    if(dashDateTo&&d>dashDateTo)return false;
    return true;
  }).sort((a,b)=>tradeDate(b)>tradeDate(a)?1:-1);

  const CPTS={Outright:1,Spread:2,Butterfly:4,"Double Fly":8};
  function getContracts(t){ 
    const l=parseFloat(t.lots)||0;
    const perLot=CPTS[t.tradeType]||1;
    const legs=(t.status==="Open")?1:2;
    return l*perLot*legs;
  }

  function getWeekKey(s){
    const d=new Date(s+"T00:00:00"),day=d.getDay(),diff=(day===0?-6:1)-day,mon=new Date(d);
    mon.setDate(d.getDate()+diff); return mon.toISOString().slice(0,10);
  }
  function weekLabel(s){
    const mon=new Date(s+"T00:00:00"),sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const f=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    return `${f(mon)} – ${f(sun)}`;
  }
  function getQtrKey(s){ const [yr,mo]=s.slice(0,7).split("-"); return `${yr}-Q${Math.ceil(parseInt(mo)/3)}`; }
  function qtrLabel(qk){ const [yr,q]=qk.split("-"); return `${{Q1:"Jan–Mar",Q2:"Apr–Jun",Q3:"Jul–Sep",Q4:"Oct–Dec"}[q]||q} ${yr}`; }

  function groupBy(arr,keyFn){
    const g={};
    arr.forEach(t=>{const k=keyFn(t);if(!k)return;if(!g[k])g[k]={pnl:0,count:0,wins:0,trades:[]};const p=parseFloat(t.pnl)||0;g[k].pnl+=p;g[k].count++;if(p>0)g[k].wins++;g[k].trades.push(t);});
    return Object.entries(g).sort((a,b)=>a[0]>b[0]?-1:1);
  }

  const days     = groupBy(filtered, t=>tradeDate(t));
  const weeks    = groupBy(filtered, t=>{const d=tradeDate(t);return d?getWeekKey(d):null;});
  const months   = groupBy(filtered, t=>{const d=tradeDate(t);return d?d.slice(0,7):null;});

    return entries.map(([k,d],i)=>{
      const wr=d.count?Math.round(d.wins/d.count*100):0;
      const ctrs=d.trades.reduce((s,t)=>s+getContracts(t),0);
      const bg=i%2===0?"var(--light)":"#fff";
      return `<tr style="background:${bg};border-bottom:1px solid var(--border);">
        <td style="padding:10px 12px;font-weight:600;color:var(--text);">${labelFn(k)}</td>

      </tr>`;
    }).join("");
  }

  const today=new Date().toISOString().slice(0,10);
  const thisMonStart=today.slice(0,7)+"-01";
  const thisWeekMon=getWeekKey(today);

  const openTrades2   = filtered.filter(t=>t.status==="Open"&&(!t.exitPrice||t.exitPrice.toString().trim()===""));
  const closedTrades2 = filtered.filter(t=>t.status==="Closed"||(t.exitPrice&&t.exitPrice.toString().trim()!==""));
  const totalPnl   = filtered.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const openPnl    = openTrades2.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const closedPnl2 = closedTrades2.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const totalCtrs  = filtered.reduce((s,t)=>s+getContracts(t),0);

  const closedCtrs = closedTrades2.reduce((s,t)=>s+getContracts(t),0);
  const wins = filtered.filter(t=>parseFloat(t.pnl)>0).length;
  const wr = filtered.length?Math.round(wins/filtered.length*100):0;
  const rrVals = filtered.map(t=>{
    const e=parseFloat(t.entryPrice),tg=parseFloat(t.target),st=parseFloat(t.stop);
    if(isNaN(e)||isNaN(tg)||isNaN(st)||!t.target||!t.stop)return null;
    const risk=Math.abs(e-st);return risk>0?Math.abs(tg-e)/risk:null;
  }).filter(x=>x!==null);
  const avgRR = rrVals.length?(rrVals.reduce((s,v)=>s+v,0)/rrVals.length).toFixed(2):null;

        </div>

          <div class="pnl-box-label">⚖️ Avg R:R</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button onclick="setDashFilter('','')" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${!dashDateFrom&&!dashDateTo?"var(--navy)":"var(--border)"};background:${!dashDateFrom&&!dashDateTo?"var(--navy)":"#fff"};color:${!dashDateFrom&&!dashDateTo?"#fff":"var(--sub)"};font-size:12px;font-weight:600;cursor:pointer;">All</button>
        <button onclick="setDashFilter('${thisWeekMon}','${today}')" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${dashDateFrom===thisWeekMon?"var(--navy)":"var(--border)"};background:${dashDateFrom===thisWeekMon?"var(--navy)":"#fff"};color:${dashDateFrom===thisWeekMon?"#fff":"var(--sub)"};font-size:12px;font-weight:600;cursor:pointer;">This Week</button>
        <button onclick="setDashFilter('${thisMonStart}','${today}')" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${dashDateFrom===thisMonStart?"var(--navy)":"var(--border)"};background:${dashDateFrom===thisMonStart?"var(--navy)":"#fff"};color:${dashDateFrom===thisMonStart?"#fff":"var(--sub)"};font-size:12px;font-weight:600;cursor:pointer;">This Month</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="date" value="${dashDateFrom}" onchange="dashDateFrom=this.value;renderDashboard()" style="flex:1;padding:7px 10px;font-size:12px;border:1.5px solid var(--border);border-radius:8px;"/>
        <span style="color:var(--sub);font-size:12px;">to</span>
        <input type="date" value="${dashDateTo}" onchange="dashDateTo=this.value;renderDashboard()" style="flex:1;padding:7px 10px;font-size:12px;border:1.5px solid var(--border);border-radius:8px;"/>
      </div>
    </div>
    <div class="divider"></div>`;

  // Daily
  html+=`<div class="section"><div class="sec-title-bar"><div class="sec-title">Daily</div></div>
    <div style="overflow-x:auto;padding:0 16px 16px;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    ${TH(["Date","Trades","Contracts","Win%","P&L"])}
    <tbody>${buildTable(days,k=>new Date(k+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}))}</tbody>
    </table></div></div><div class="divider"></div>`;

  // Weekly
  html+=`<div class="section"><div class="sec-title-bar"><div class="sec-title">Weekly</div></div>
    <div style="overflow-x:auto;padding:0 16px 16px;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    ${TH(["Week","Trades","Contracts","Win%","P&L"])}
    <tbody>${buildTable(weeks,weekLabel)}</tbody>
    </table></div></div><div class="divider"></div>`;

  // Monthly
  html+=`<div class="section"><div class="sec-title-bar"><div class="sec-title">Monthly</div></div>
    <div style="overflow-x:auto;padding:0 16px 16px;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    ${TH(["Month","Trades","Contracts","Win%","P&L"])}
    <tbody>${buildTable(months,k=>{const[yr,mo]=k.split("-");return new Date(yr,parseInt(mo)-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});})}</tbody>
    </table></div></div><div class="divider"></div>`;

  // Quarterly
  html+=`<div class="section"><div class="sec-title-bar"><div class="sec-title">Quarterly</div></div>
    <div style="overflow-x:auto;padding:0 16px 16px;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
    ${TH(["Quarter","Trades","Contracts","Win%","P&L"])}
    <tbody>${buildTable(quarters,qtrLabel)}</tbody>
    </table></div></div><div class="divider"></div>`;

  showContent(html);
}
// ── PRICES TAB ────────────────────────────────────────────────────────────
function renderPrices(){
  if(!fbData){showEmpty("Waiting for price data…<br/>Make sure bridge.py is running.");return;}
  const o=fbData.outrights||{}, d=fbData.derived||{};

  function priceTable(title, entries, cols){
    if(!entries.length) return "";
    const headers = cols.map((c,i)=>`<th style="padding:9px 12px;text-align:${i===0?"left":"center"};font-weight:600;${i===0?"border-radius:8px 0 0 0;":""}${i===cols.length-1?"border-radius:0 8px 0 0;text-align:right;":""}">${c}</th>`).join("");
    const rows = entries.map(([name,v],i)=>{
      const bg = i%2===0?"var(--light)":"#fff";
      const shortName = name.replace(/FCPO /g,"").replace(/ Calendar/g,"").replace(/ 1mo Butterfly/g," Fly");
      if(cols.length===5){
        // Outrights: Name | Bid | Ask | Last | Mid
        return `<tr style="background:${bg};border-bottom:1px solid var(--border);">
          <td style="padding:8px 12px;font-weight:600;color:var(--text);">${shortName}</td>
          <td style="padding:8px 12px;text-align:center;color:var(--sub);">${v.bid??'—'}</td>
          <td style="padding:8px 12px;text-align:center;color:var(--sub);">${v.ask??'—'}</td>
          <td style="padding:8px 12px;text-align:center;color:var(--sub);">${v.last??'—'}</td>
          <td style="padding:8px 12px;text-align:right;font-weight:700;color:var(--navy);">${v.mid??'—'}</td>
        </tr>`;
      } else {
        // Spreads/Jumbos/Flies: Name | Price
        const p = v.mid;
        return `<tr style="background:${bg};border-bottom:1px solid var(--border);">
          <td style="padding:8px 12px;font-weight:600;color:var(--text);">${shortName}</td>
          <td style="padding:8px 12px;text-align:right;font-weight:700;color:${p>0?"var(--green)":p<0?"var(--red)":"var(--navy)"};">${p??'—'}</td>
        </tr>`;
      }
    }).join("");
    return `<div class="section">
      <div class="sec-title-bar"><div class="sec-title">${title}</div></div>
      <div style="overflow-x:auto;padding:0 16px 16px;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:var(--navy);color:#fff;">${headers}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div><div class="divider"></div>`;
  }

  const fcpoOut = Object.entries(o).filter(([k])=>k.startsWith("FCPO ")).sort((a,b)=>a[0]>b[0]?1:-1);
  const spreads = Object.entries(d).filter(([,v])=>v.type==="spread").sort((a,b)=>a[0]>b[0]?1:-1);
  const jumbos  = Object.entries(d).filter(([,v])=>v.type==="jumbo").sort((a,b)=>a[0]>b[0]?1:-1);
  const flies   = Object.entries(d).filter(([,v])=>v.type==="fly").sort((a,b)=>a[0]>b[0]?1:-1);

  let html = priceTable("FCPO Outrights", fcpoOut, ["Contract","Bid","Ask","Last","Mid"]);
  html += priceTable("Spreads", spreads, ["Spread","Price"]);
  html += priceTable("Jumbos",  jumbos,  ["Jumbo","Price"]);
  html += priceTable("Butterflies", flies, ["Fly","Price"]);

  showContent(html || `<div class="loading"><div class="empty-msg">No price data available.</div></div>`);
}

// ── JOURNAL TAB ───────────────────────────────────────────────────────────
function renderJournal(){
  const filtered=jFilter==="all"?trades:jFilter==="open"?trades.filter(t=>t.status==="Open"):trades.filter(t=>t.status==="Closed");
  const sorted=[...filtered].sort((a,b)=>b.date<a.date?-1:1);
  const totalPnl=trades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const wins=trades.filter(t=>parseFloat(t.pnl)>0).length;
  const total=trades.filter(t=>t.pnl).length;

  let html=`<div class="j-wrap">
    <div class="j-stats">
      <div class="j-stat">
        <div class="j-stat-label">P&L</div>
        <div class="j-stat-val ${fc(totalPnl)}" style="font-size:15px;">${fmt(totalPnl)}</div>
      </div>
      <div class="j-stat">
        <div class="j-stat-label">Win Rate</div>
        <div class="j-stat-val" style="color:var(--navy);font-size:15px;">${total?Math.round(wins/total*100):0}%</div>
      </div>
      <div class="j-stat">
        <div class="j-stat-label">Trades</div>
        <div class="j-stat-val" style="font-size:15px;">${trades.length}</div>
      </div>
    </div>
    <div class="j-filters">
      <button class="j-chip ${jFilter==="all"?"on":""}" onclick="setJFilter('all')">All</button>
      <button class="j-chip ${jFilter==="open"?"on":""}" onclick="setJFilter('open')">Open</button>
      <button class="j-chip ${jFilter==="closed"?"on":""}" onclick="setJFilter('closed')">Closed</button>
    </div>`;

  if(!sorted.length){
    html+=`<div class="loading"><div class="empty-msg">No trades.<br/>Tap + to log one.</div></div>`;
  } else {
    sorted.forEach(t=>{
      const pnl=parseFloat(t.pnl)||0;
      html+=`<div class="j-card ${pnl>0?"pos-b":pnl<0?"neg-b":""}">
        <div class="j-card-top">
          <div>
            <div class="j-name">${t.product} · ${t.contract}</div>
            <div class="j-sub">${t.tradeType||"Outright"} · ${t.lots} lots · ${t.date}</div>
          </div>
          <div style="text-align:right">
            <div class="j-pnl ${fc(pnl)}">${fmt(pnl)}</div>
            <div class="j-actions" style="margin-top:6px;">
              <button class="j-btn-edit" onclick="editTrade('${t.id}')">Edit</button>
              <button class="j-btn-del" onclick="deleteTrade('${t.id}')">Delete</button>
            </div>
          </div>
        </div>
        <div class="j-card-mid">
          <div><div class="j-field-label">Entry</div><div class="j-field-val">${t.entryPrice||"—"}</div></div>
          <div><div class="j-field-label">Exit</div><div class="j-field-val">${t.exitPrice||"—"}</div></div>
          <div><div class="j-field-label">Target</div><div class="j-field-val">${t.target||"—"}</div></div>
          <div><div class="j-field-label">Stop</div><div class="j-field-val">${t.stop||"—"}</div></div>
        </div>
        <div class="j-card-bot">
          <span class="j-badge ${t.side==="Buy"?"buy":"sell"}">${t.side}</span>
          <span class="j-badge ${t.status==="Open"?"open":"closed"}">${t.status||"Closed"}</span>
          <span class="j-badge type">${t.tradeType||"Outright"}</span>
          ${t.closeDate&&t.closeDate!==t.date?`<span class="j-date">→ ${t.closeDate}</span>`:`<span class="j-date">${t.date}</span>`}
        </div>
      </div>`;
    });
  }
  html+=`</div>`;
  showContent(html);
  const old=document.getElementById("j-fab");if(old)old.remove();
  const fab=document.createElement("button");
  fab.id="j-fab";fab.className="j-fab";fab.innerHTML="+";
  fab.onclick=()=>openTradeForm(null);
  document.getElementById("app").appendChild(fab);
}

function setJFilter(v){jFilter=v;renderJournal();}

// ── TRADE FORM ────────────────────────────────────────────────────────────
function contractOptions(selected,product){
  if(product!=="FCPO")return `<input class="f-input" id="f-contract" placeholder="Contract" value="${selected||""}"/>`;
  return `<select class="f-select" id="f-contract">
    <option value="">— Select —</option>
    <optgroup label="Outrights">${FCPO_CONTRACTS.outrights.map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("")}</optgroup>
    <optgroup label="Spreads">${FCPO_CONTRACTS.spreads.map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("")}</optgroup>
    <optgroup label="Jumbos">${FCPO_CONTRACTS.jumbos.map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("")}</optgroup>
    <optgroup label="Butterflies">${FCPO_CONTRACTS.flies.map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("")}</optgroup>
  </select>`;
}

function openTradeForm(trade){
  jEditId=trade?trade.id:null;
  const today=new Date().toISOString().slice(0,10);
  const t=trade||{date:today,closeDate:"",product:"FCPO",contract:"",side:"Buy",status:"Closed",tradeType:"Outright",lots:"",entryPrice:"",exitPrice:"",target:"",stop:"",pnl:"",reason:""};
  const overlay=document.createElement("div");
  overlay.className="modal-overlay";overlay.id="trade-modal";
  overlay.innerHTML=`<div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">${jEditId?"Edit Trade":"Log Trade"}</div>
    <div class="f-grid">
      <div class="f-field"><div class="f-label">Entry Date</div><input class="f-input" type="date" id="f-date" value="${t.date}"/></div>
      <div class="f-field"><div class="f-label">Close Date</div><input class="f-input" type="date" id="f-closeDate" value="${t.closeDate||""}"/></div>
    </div>
    <div class="f-grid">
      <div class="f-field"><div class="f-label">Product</div>
        <select class="f-select" id="f-product" onchange="updateContractField()">${PRODUCTS.map(p=>`<option ${p===t.product?"selected":""}>${p}</option>`).join("")}</select>
      </div>
      <div class="f-field"><div class="f-label">Type</div>
        <select class="f-select" id="f-tradeType">${TRADE_TYPES.map(tt=>`<option ${tt===t.tradeType?"selected":""}>${tt}</option>`).join("")}</select>
      </div>
    </div>
    <div class="f-field" id="contract-field-wrap">
      <div class="f-label">Contract</div>
      ${contractOptions(t.contract, t.product)}
    </div>
    <div class="f-grid">
      <div class="f-field"><div class="f-label">Side</div>
        <select class="f-select" id="f-side"><option ${t.side==="Buy"?"selected":""}>Buy</option><option ${t.side==="Sell"?"selected":""}>Sell</option></select>
      </div>
      <div class="f-field"><div class="f-label">Status</div>
        <select class="f-select" id="f-status"><option ${(t.status||"Closed")==="Closed"?"selected":""}>Closed</option><option ${t.status==="Open"?"selected":""}>Open</option></select>
      </div>
    </div>
    <div class="f-grid3">
      <div class="f-field"><div class="f-label">Lots</div><input class="f-input" type="number" id="f-lots" value="${t.lots}" placeholder="10"/></div>
      <div class="f-field"><div class="f-label">Entry</div><input class="f-input" type="number" step="any" id="f-entry" value="${t.entryPrice}"/></div>
      <div class="f-field"><div class="f-label">Exit</div><input class="f-input" type="number" step="any" id="f-exit" value="${t.exitPrice}"/></div>
    </div>
    <div class="f-grid">
      <div class="f-field"><div class="f-label">Target</div><input class="f-input" type="number" step="any" id="f-target" value="${t.target}"/></div>
      <div class="f-field"><div class="f-label">Stop</div><input class="f-input" type="number" step="any" id="f-stop" value="${t.stop}"/></div>
    </div>
    <div class="f-field"><div class="f-label">Net P&L (USD) — leave blank to auto-calculate</div>
      <input class="f-input" type="number" step="any" id="f-pnl" value="${t.pnl}" placeholder="auto"/>
    </div>
    <div class="f-field"><div class="f-label">Notes</div><textarea class="f-textarea" id="f-reason" placeholder="Rationale…">${t.reason||""}</textarea></div>
    <button class="f-btn" onclick="saveTrade()">${jEditId?"Save Changes":"Log Trade"}</button>
    <button class="f-btn-sec" onclick="closeModal()">Cancel</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
}

function updateContractField(){
  const product=document.getElementById("f-product").value;
  const wrap=document.getElementById("contract-field-wrap");
  const currentVal=document.getElementById("f-contract")?document.getElementById("f-contract").value:"";
  wrap.innerHTML=`<div class="f-label">Contract</div>${contractOptions(currentVal,product)}`;
}

function saveTrade(){
  const date=document.getElementById("f-date").value;
  const closeDate=document.getElementById("f-closeDate").value;
  const product=document.getElementById("f-product").value;
  const tradeType=document.getElementById("f-tradeType").value;
  const contract=document.getElementById("f-contract").value.trim();
  const side=document.getElementById("f-side").value;
  const status=document.getElementById("f-status").value;
  const lots=document.getElementById("f-lots").value;
  const entryPrice=document.getElementById("f-entry").value;
  const exitPrice=document.getElementById("f-exit").value;
  const target=document.getElementById("f-target").value;
  const stop=document.getElementById("f-stop").value;
  const reason=document.getElementById("f-reason").value;
  if(!contract||!lots){showToast("Contract and lots are required");return;}
  let pnl=document.getElementById("f-pnl").value;
  if(!pnl&&entryPrice&&exitPrice&&lots&&product==="FCPO"){
    const e=parseFloat(entryPrice),x=parseFloat(exitPrice),l=parseFloat(lots);
    const gross=((side==="Buy"?(x-e):(e-x))/TS)*l*TV;
    const tc=l*(CPT[tradeType]||1)*FCPO_TC*2;
    pnl=(gross-tc).toFixed(2);
  }
  const id=jEditId||Date.now().toString();
  const trade={id,date,closeDate,product,tradeType,contract,side,status,lots,entryPrice,exitPrice,target,stop,pnl,reason,learnings:""};
  db.ref("/trades/"+id).set(trade)
    .then(()=>{closeModal();showToast(jEditId?"Trade updated ✓":"Trade logged ✓");})
    .catch(e=>showToast("Error: "+e.message));
}

function editTrade(id){
  const t=trades.find(t=>String(t.id)===String(id));
  if(t)openTradeForm(t);
  else showToast("Trade not found");
}

function deleteTrade(id){
  if(!confirm("Delete this trade?"))return;
  db.ref("/trades/"+id).remove().then(()=>showToast("Deleted")).catch(e=>showToast("Error: "+e.message));
}
function closeModal(){const m=document.getElementById("trade-modal");if(m)m.remove();jEditId=null;}

// ── HELPERS ───────────────────────────────────────────────────────────────
function showContent(html){
  const ls=document.getElementById("loading-state");
  if(ls)ls.style.display="none";
  const m=document.getElementById("main-content");
  if(m){m.style.display="block";m.innerHTML=html;}
}
function showEmpty(msg){showContent(`<div class="loading"><div class="empty-msg">${msg}</div></div>`);}

document.addEventListener("DOMContentLoaded",()=>{
  renderPnl();
  initFirebase();
});

function switchTab(tab){
  currentTab=tab;
  ["pnl","dashboard","prices","journal","settings"].forEach(t=>document.getElementById("tab-"+t).classList.toggle("active",t===tab));
  const subs={pnl:"Live P&L",dashboard:"Dashboard",prices:"Market Prices",journal:"Trade Journal",settings:"Settings"};
  document.getElementById("header-sub").textContent=subs[tab];
  const fab=document.getElementById("j-fab");if(fab&&tab!=="journal")fab.remove();
  if(tab==="pnl")renderPnl();
  else if(tab==="dashboard")renderDashboard();
  else if(tab==="prices")renderPrices();
  else if(tab==="journal")renderJournal();
  else renderSettings();
}
let toastTimer;
function showToast(msg){
  const e=document.querySelector(".toast");if(e)e.remove();
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2500);
}
